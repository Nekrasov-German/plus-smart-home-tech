kafka:
  consumer:
    bootstrap-servers: localhost:9092
    auto-offset-reset: earliest
    max-poll-records: 100
    session-timeout-ms: 30000

  hub-consumer:
    group-id: hub-consumer-group
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.yandex.practicum.HubDeserializer

  snapshot-consumer:
    group-id: snapshot-consumer-group
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.yandex.practicum.SnapshotDeserializer

spring:
  datasource:
    url: jdbc:postgresql://localhost:6543/analyzer
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext